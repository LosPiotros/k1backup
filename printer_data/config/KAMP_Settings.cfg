# ==============================================================================
# KAMP Settings - Zoptymalizowany pod Creality K1 (Line_Purge & Smart_Park)
# ==============================================================================

[include ./KAMP/Line_Purge.cfg]             # Włączone: inteligentna linia czyszczący przed wydrukiem
[include ./KAMP/Smart_Park.cfg]             # Włączone: parkowanie głowicy blisko obszaru wydruku

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP 

# Ogólne ustawienia
variable_verbose_enable: True               # Komunikaty konsoli włączone do diagnostyki
variable_mesh_margin: 0                     
variable_fuzz_amount: 0                     

# Ustawienia sondy (nie dotyczy Cartographera w tym kontekście, zachowane dla zgodności)
variable_probe_dock_enable: False           
variable_attach_macro: 'Attach_Probe'       
variable_detach_macro: 'Dock_Probe'         

# Ustawienia linii czyszczącej (Line Purge)
variable_purge_height: 0.8                  # Wysokość Z dyszy podczas purgowania
variable_tip_distance: 0                    # Dystans od czubka filamentu
variable_purge_margin: 15                   # Margines 15 mm przed obiektem (bezpieczny dla stołu 220x220)
variable_purge_amount: 15                   # 15 mm filamentu – idealne zalanie dyszy po retrakcji
variable_flow_rate: 10                      # 10 mm³/s – płynny, dynamiczny wypływ (bez ślimaczenia i rwania)

# Ustawienia Smart Park
variable_smart_park_height: 10              # Wysokość Z podczas parkowania przed startem

gcode: 
    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}