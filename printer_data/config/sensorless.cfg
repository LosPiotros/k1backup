# thanks to zarboz for the original configs and shima for editing to speed up and make more universal to creality printers :)
[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {action_respond_info("=== ROZPOCZYNAM BAZOWANIE (HOMING) ===")}
    M117 Bazowanie osi...
    G90
    G0 Z5 F600
    {% if home_all or 'X' in params %}
     _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
     _HOME_Y
    {% endif %}
    # the duplication of these conditions is intentional
    {% if home_all or 'X' in params %}
     _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
     _HOME_Y
    {% endif %}
    {% if home_all or 'Z' in params %}
     _HOME_Z
    {% endif %}
    {action_respond_info("Wszystkie osie odnalezione! Maszyna idealnie zorientowana w przestrzeni.")}
    M117 Bazowanie zakończone!

[gcode_macro _HOME_X]
gcode:
    {action_respond_info("[Oś X] Zmniejszam prąd silników do 0.8A i ruszam w PRAWO na poszukiwanie oporu (StallGuard)...")}
    M117 Bazowanie X (Prawo)...
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.8 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Lift Z before Home X
    G1 Z10 F800
    # Home
    G28 X
    # Move away
    {action_respond_info("[Oś X] Banda po prawej uderzona! Odbijam się w lewo...")}
    G91
    G1 X-10 F800

    {action_respond_info("[Oś X] Czekam chwilę, aż rejestry StallGuard wyczyszczą bufor...")}
    G4 P1000

    {action_respond_info("[Oś X] Przywracam pełne robocze prądy silników.")}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    G90    # powrót do pozycjonowania absolutnego

[gcode_macro _HOME_Z]
gcode:
    {action_respond_info("[Oś Z] Ustawiam głowicę na absolutnym środku stołu...")}
    M117 Bazowanie Z (Środek)...
    # Always use consistent run_current on A/B steppers during sensorless homing
    G90
    {% set cartographer = ('cartographer' in printer.configfile.settings) %}
    {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
    {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
    G0 X{POSITION_X} Y{POSITION_Y} F2800
    {% if cartographer %}
        {action_respond_info("[Cartographer] Aktywuję sondę nad powierzchnią stołu...")}
    {% endif %}
    G28 Z
    G90
    {% if cartographer %}
        {action_respond_info("[Cartographer] Pomiar wysokości Z zakończony sukcesem.")}
    {% endif %}
    
    {% if not cartographer %}
        G1 Z10 F800
    {% endif %}

    # Wait just a second… (give StallGuard registers time to clear)
    {action_respond_info("[Oś Z] Stabilizacja zakończona.")}
    G4 P1000

[gcode_macro _HOME_Y]
gcode:
    {action_respond_info("[Oś Y] Zmniejszam prądy na A/B do 0.8A i ruszam w tył obudowy...")}
    M117 Bazowanie Y (Tył)...
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.8 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    {action_respond_info("[Oś Y] Oparcie w tle wykryte! Odbijam się bezpiecznie do przodu...")}
    G91
    G1 Y+10 F800

    {action_respond_info("[Oś Y] Daję chwilę StallGuardowi na złapanie oddechu...")}
    G4 P1000

    {action_respond_info("[Oś Y] Przywracam normalne robocze prądy silników.")}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    G90    # powrót do pozycjonowania absolutnego