[gcode_macro Warmup]
variable_maxx: 10000
variable_maxy: 10000
variable_maxd: 14142
gcode:
  {% set loop_cnt = params.LOOPS|default(5)|int %}
  {% set maxx = params.MAXX|default(10000)|int %}
  {% set maxy = params.MAXY|default(10000)|int %}
  {% set maxd = params.MAXD|default(14142)|int %}
  {% set speed = params.SPEED|default(300)|int * 60 %}
  {% set max_x = (printer.toolhead.axis_maximum.x|int - 10) %}
  {% set max_y = (printer.toolhead.axis_maximum.y|int - 10) %}
  {% set loop_step_y = max_y // ([loop_cnt - 1, 1]|max) %}
  {% set loop_step_x = max_x // ([loop_cnt - 1, 1]|max) %}

  G28
  G90
  G0 Z20 F1200

  ; Rozgrzewka osi X
  SET_VELOCITY_LIMIT ACCEL={maxx} MINIMUM_CRUISE_RATIO=0.5
  {% for number in range(10, max_y + 1, loop_step_y) %}
    G1 F{speed} X10 Y{number}
    G1 F{speed} X{max_x} Y{number}
  {% endfor %}

  ; Rozgrzewka osi Y
  SET_VELOCITY_LIMIT ACCEL={maxy} MINIMUM_CRUISE_RATIO=0.5
  {% for number in range(10, max_x + 1, loop_step_x) %}
    G1 F{speed} X{number} Y{max_y}
    G1 F{speed} X{number} Y10
  {% endfor %}

  ; Ruch po przekątnych
  SET_VELOCITY_LIMIT ACCEL={maxd} MINIMUM_CRUISE_RATIO=0.5
  {% for times in range(loop_cnt) %}
    G1 F{speed} X10 Y10
    G1 F{speed} X{max_x} Y{max_y}
    G1 F{speed} X10 Y{max_y}
    G1 F{speed} X{max_x} Y10
  {% endfor %}

  ; Przywrócenie fabrycznych limitów prędkości z printer.cfg
  SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO=0.5