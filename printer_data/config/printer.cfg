[include mainsail.cfg]
[include sensorless.cfg]
[include gcode_macro.cfg]
[include timelapse.cfg]
[include KAMP_Settings.cfg]
[include shell_command.cfg]
[include Warmup.cfg]
[exclude_object]
#===MCU===
[mcu]
serial: serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3F00320013504B5735313920-if00
restart_method: command

[mcu Nozzle_MCU]
serial: /dev/serial/by-path/platform-fe9c0000.xhci-usb-0:1.3.2:1.0-port0
baud: 230400
restart_method: command

[mcu CM4]
serial: /tmp/klipper_host_mcu

[mcu cartographer]
serial: /dev/serial/by-path/platform-fe9c0000.xhci-usb-0:1.2.2:1.0                  # uncomment if using cartographer
restart_method: command

[temperature_sensor Manta M5P]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
#===SAFETY SETTINGS===

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[idle_timeout]
gcode = 
    M104 S0 # turn off hotend
    M140 S0 # turn off bed heater
    M107 P0 # turn off part fan
    M107 P2 # turn off side fan
    M107 P3 # turn off chamber fan
    {action_respond_info("Idle timeout reached. Heaters and fans powered down.")} # Let the user know what is happening
    M84 # unlock steppers
timeout = 3000

[gcode_arcs]
resolution: 1.0

#===CARTOGRAPHER===

[cartographer]
mcu: cartographer
x_offset: -24.664                        
y_offset: 0
verbose: yes

#===MOTORS===

[stepper_x]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 219
position_min: 0
position_max: 219
homing_speed: 50
homing_retract_dist:0

[tmc2209 stepper_x]
uart_pin: PB10
run_current: 1.14
interpolate: true
#hold_current:1.0
#stealthchop_threshold: 0
diag_pin: ^PC3
sense_resistor: 0.100
#driver_SGTHRS: 140

[stepper_y]
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 218
homing_speed: 50
homing_retract_dist:0

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 1.14
interpolate: true
#hold_current:1.0
#stealthchop_threshold: 0
diag_pin: ^PD2
sense_resistor: 0.100
#driver_SGTHRS: 140

[stepper_z]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 16
rotation_distance:8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop # uses cartographer as virtual endstop
homing_retract_dist: 0 # cartographer needs this to be set to 0
position_max: 255
position_min: -5
homing_speed: 20
second_homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PD9
interpolate: True
run_current: 1.14
#hold_current:1.0
diag_pin: ^PD3
#stealthchop_threshold: 0
#driver_SGTHRS: 0
sense_resistor: 0.100

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
sg4_thrs:95
tuning_goal: performance

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
sg4_thrs:95
tuning_goal: performance

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
sg4_thrs:0
tuning_goal: silent

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: Nozzle_MCU:PB1
dir_pin: !Nozzle_MCU:PB0
enable_pin: !Nozzle_MCU:PB2
microsteps: 16
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: Nozzle_MCU:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: Nozzle_MCU:PA0
pressure_advance: 0.02
pressure_advance_smooth_time: 0.01
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: Nozzle_MCU:PB11
tx_pin: Nozzle_MCU:PB10
uart_address: 3
run_current: 0.65
sense_resistor: 0.150
stealthchop_threshold: 0

# ===HEATERS===

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F #stock bed thermistor
sensor_pin: PA0
min_temp: 0
max_temp: 120

#===FAN CONFIGS===

[duplicate_pin_override]
pins: PB0, PF9, PA2, PC5, PA3, PB5, PB2

[multi_pin heater_fans]
pins:nozzle_mcu:PB5,PB2

[heater_fan hotend_fan]
#pin: multi_pin:heater_fans
pin: Nozzle_MCU:PB5
tachometer_pin: ^Nozzle_MCU:PB4
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: Nozzle_MCU: PB6

[fan_generic Part_Fan] 
pin: !Nozzle_MCU: PB8
tachometer_pin: ^Nozzle_MCU: PB3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.300
cycle_time: 0.010
hardware_pwm: False

[fan_generic Side_Fan]
pin: PA4
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.300
cycle_time: 0.010
hardware_pwm: False

[temperature_fan Chamber_Fan]
pin: PA3
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 0
max_temp: 100
control: watermark
max_delta: 2
target_temp: 70
max_speed: 1.0
min_speed: 0.0

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[force_move]
enable_force_move: True 

[bed_mesh]
zero_reference_position: 112.5,112.5  # Bed Center
speed: 200              # for touch you can push it to 250
mesh_min: 10,20
mesh_max: 191,218
horizontal_move_z: 3
probe_count: 40,40      # tested 100x100 working
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

#===PRINTER SETTINGS===

[adxl345]
#cs_pin: scanner:PA3 #If not using Cartographer, comment out this line and uncomment the line below
cs_pin: Nozzle_MCU:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: Nozzle_MCU:PA5
spi_software_mosi_pin: Nozzle_MCU:PA7
spi_software_miso_pin: Nozzle_MCU:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
min_freq: 5
max_freq: 90
probe_points:
   110,110,10

[input_shaper]
shaper_freq_x: 64  # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 55.4 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.070 # damping ratio for the X axis
damping_ratio_y: 0.042 # damping ratio for the Y axis

[display_status]

[filament_switch_sensor filament_sensor] # Stock filament sensor
pause_on_runout: true
switch_pin: !PC2

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
max_z_velocity: 7.5
square_corner_velocity: 5.0
max_z_accel: 150

[pause_resume]

[firmware_retraction]
retract_length: 0.4
retract_speed: 50
unretract_speed: 50

[shaketune]
show_macros_in_webui: True
measurements_chunk_size: 2
dpi: 300
keep_raw_data: False
number_of_results_to_keep: 10
timeout: 600

[axis_twist_compensation]
calibrate_start_x: 20
calibrate_end_x: 200
calibrate_y: 112.5


[board_pins] #POPRAWNE
aliases:
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

