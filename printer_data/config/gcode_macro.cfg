# K1 - Czysta, odchudzona konfiguracja makr bez zewnętrznych zależności
# CreateDate: 2026

[gcode_macro PRINTER_PARAM]
variable_z_safe_pause: 0.0
variable_z_safe_g28: 3.0
variable_max_x_position: 226.0
variable_max_y_position: 200.0
variable_max_z_position: 250.0
variable_fans: 3
variable_auto_g29: 0
variable_fan0_min: 25
variable_fan1_min: 50
variable_fan2_min: 180
variable_fan2_speed: 0
variable_hotend_temp: 0
variable_e_min_current: 0.27
gcode:

[gcode_macro LOAD_MATERIAL_CLOSE_FAN2]
description: Zabezpieczenie i wyłączenie pomocniczego wiatraka (Side_Fan) na czas ładowania
variable_fan2_value: 0.0
gcode:
    SAVE_GCODE_STATE NAME=myMoveState
    {% if printer['fan_generic Side_Fan'].speed > 0.0 %}
        SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL_CLOSE_FAN2 VARIABLE=fan2_value VALUE={printer['fan_generic Side_Fan'].speed}
        SET_FAN_SPEED FAN=Side_Fan SPEED=0
    {% endif %}

[gcode_macro LOAD_MATERIAL_RESTORE_FAN2]
description: Przywrócenie stanu pomocniczego wiatraka (Side_Fan) po ładowaniu
gcode:
    {% set fan2_value = printer['gcode_macro LOAD_MATERIAL_CLOSE_FAN2'].fan2_value|float %}
    RESTORE_GCODE_STATE NAME=myMoveState
    {% if fan2_value > 0.0 %}
        SET_FAN_SPEED FAN=Side_Fan SPEED={fan2_value}
        SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL_CLOSE_FAN2 VARIABLE=fan2_value VALUE=0
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Anulowanie wydruku z uśmiechem i ewakuacją
rename_existing: CANCEL_PRINT_BASE
gcode:
    {action_respond_info("=== ANULUJEMY WYDRUK! RATUJEMY CO SIĘ DA ===")}
    M117 Anulowanie druku...

    ##### pobieramy parametry klienta #####
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
    {% set retract = client.cancel_retract|default(5.0)|abs %}
    
    ##### definicja pozycji parkowania #####
    {% set park_x = "" if (client.custom_park_x|default(none) is none)
              else "X=" ~ client.custom_park_x %}
    {% set park_y = "" if (client.custom_park_y|default(none) is none)
              else "Y=" ~ client.custom_park_y %}
    {% set custom_park = park_x|length > 0 or park_y|length > 0 %}
    ##### koniec definicji #####
    
    # przywrócenie domyślnego timeoutu bezczynności
    {% if printer['gcode_macro RESUME'].restore_idle_timeout is defined and printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
    {% endif %}
    
    # Parkowanie głowicy, jeśli jest dozwolone
    {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} 
      {action_respond_info("Uciekamy głowicą na bezpieczny parking, żeby nie przepalić modelu...")}
      _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} 
    {% endif %}
    
    {action_respond_info("Robię szybką retrakcję, żeby glut nie został na blacie...")}
    _CLIENT_RETRACT LENGTH={retract}
    
    {action_respond_info("Gasimy piece i wiatraki – pora na zasłużony odpoczynek sprzętu.")}
    TURN_OFF_HEATERS
    
    # Gasimy komplet wentylatorów (wydruk, boczny Side_Fan i komorę)
    M106 S0       # Wyłącza Part_Fan (P0)
    M107 P2       # Wyłącza Side_Fan
    M107 P3       # Wyłącza Chamber_Fan
    
    {client.user_cancel_macro|default("")}
    
    {% if printer['gcode_macro RESUME'].idle_state is defined %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% endif %}
    
    # czyszczenie flag warstw pod kolejny start
    {% if printer['pause_next_layer'] is defined %}
      SET_PAUSE_NEXT_LAYER ENABLE=0
    {% endif %}
    {% if printer['pause_at_layer'] is defined %}
      SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    {% endif %}
    
    M117 Wydruk anulowany!
    {action_respond_info("Wydruk skasowany. Niekiedy porażka to tylko krok do lepszego projektu. Odpoczywamy!")}
    
    CANCEL_PRINT_BASE

[gcode_macro M109]
description: Czekaj na temperaturę hotendu przed kontynuacją
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        {action_respond_info("Grzeję hotend i czekam, aż temperatura osiągnie " ~ s ~ "°C...")}
        M117 Grzanie do {s}°C...
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s}
        {action_respond_info("Hotend gotowy! Temperatura " ~ s ~ "°C osiągnięta.")}
    {% endif %}

[gcode_macro LOAD_MATERIAL]
description: Główna procedura ładowania filamentu z obsługą pomocniczego chłodzenia
gcode:
    {% set TEMPERATURE = params.TEMPERATURE|default(245)|float %}
    {action_respond_info("=== PROCEDURA KARMIENIA EKSTRUDERA ===")}
    M117 Przygotowanie do ładowania...

    {action_respond_info("[1/4] Zabezpieczam auxiliary fan (Side_Fan)...")}
    LOAD_MATERIAL_CLOSE_FAN2

    {action_respond_info("[2/4] Rozgrzewam hotend do " ~ TEMPERATURE ~ "°C...")}
    M109 S{TEMPERATURE}

    {action_respond_info("[3/4] Wpycham 80 mm świeżego plastiku do hotendu...")}
    M117 Wpycham filament...
    G91
    G1 E80 F180
    G90

    {action_respond_info("[4/4] Przywracam stan wiatraka Side_Fan...")}
    M117 Porządki po ładowaniu...
    LOAD_MATERIAL_RESTORE_FAN2

    M117 Załadowano pomyślnie!
    {action_respond_info("Karmiciel w pełni usatysfakcjonowany, makaron w środku, można przepalać dyszę!")}

[gcode_macro QUIT_MATERIAL]
description: Bezpieczne wycofanie i usunięcie filamentu z hotendu
gcode:
    {% set TEMPERATURE = params.TEMPERATURE|default(245)|float %}
    {action_respond_info("=== ROZPOCZYNAM EWAKUACJĘ FILAMENTU (QUIT) ===")}
    M117 Ewakuacja filamentu...

    {action_respond_info("[1/3] Zapisuję pozycję i rozgrzewam hotend do " ~ TEMPERATURE ~ "°C...")}
    M117 Grzanie do wyciągania...
    SAVE_GCODE_STATE NAME=myMoveState
    M109 S{TEMPERATURE}

    {action_respond_info("[2/3] Formułuję czystą końcówkę: pchnięcie i szybki strzał w tył...")}
    M117 Wyciąganie i szarpanie...
    G91
    G1 E20 F180
    G1 E-30 F180
    G1 E-50 F2000
    G90

    {action_respond_info("[3/3] Przywracam stan głowicy. Operacja zakończona sukcesem!")}
    RESTORE_GCODE_STATE NAME=myMoveState
    
    M117 Filament ewakuowany!
    {action_respond_info("Stary plastik pomyślnie eksmitowany z hotendu. Czas na świeżą dostawę!")}

[gcode_macro M205]
description: Ustawienie Square Corner Velocity (SCV)
gcode:
    {% set scv = params.X|default(params.Y)|default(params.S)|default(5)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}
    {action_respond_info("Zmieniam Square Corner Velocity na: " ~ scv)}

[gcode_macro M106]
description: Sterowanie wentylatorami. P0 - wydruk, P2 - boczny/pomocniczy, P3 - komora
gcode:
    {% set fan_map = {0: "Part_Fan", 2: "Side_Fan", 3: "Chamber_Fan"} %}
    {% set fan_id = params.P|default(0)|int %}
    {% set fan = fan_map[fan_id] %}
    {% set speed_param = params.S|default(255)|int %}
    {% if speed_param > 0 %}
        {% set speed = (speed_param|float / 255) %}
    {% else %}
        {% set speed = 0 %}
    {% endif %}
    SET_FAN_SPEED FAN={fan} SPEED={speed}

[gcode_macro M107]
description: Wyłączenie wentylatora. P0 - wydruk, P2 - boczny/pomocniczy, P3 - komora
gcode:
    {% set fan_map = {0: "Part_Fan", 2: "Side_Fan", 3: "Chamber_Fan"} %}
    {% set fan_id = params.P|default(0)|int %}
    {% set fan = fan_map[fan_id] %}
    SET_FAN_SPEED FAN={fan} SPEED=0

[gcode_macro M900]
description: Kompatybilność z Marlin Pressure Advance (M900 K...)
gcode:
    {% if 'K' in params %}
        {% if 'E' in params %}
            SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
            {action_respond_info("Pressure Advance ustawiony dla ekstrudera " ~ params.E ~ " na wartość K=" ~ params.K)}
        {% else %}
            SET_PRESSURE_ADVANCE ADVANCE={params.K}
            {action_respond_info("Pressure Advance ustawiony na K=" ~ params.K ~ ". Narożniki będą ostre jak brzytwa!")}
            M117 PA K={params.K}
        {% endif %}
    {% endif %}

[delayed_gcode wait_temp]
gcode:
    {% set cur_temp = printer.extruder.temperature %}
    {% if cur_temp|int < 40 %}
        WAIT_TEMP_END
    {% else %}
        UPDATE_DELAYED_GCODE ID=wait_temp DURATION=5
    {% endif %}

[gcode_macro WAIT_TEMP_START]
description: Rozpoczęcie procedury chłodzenia i oczekiwania poniżej 40°C
gcode:
    {action_respond_info("=== CHŁODZENIE KONTROLOWANE START ===")}
    {action_respond_info("Odpalam wiatraki na 100% i czekam, aż hotend ostygnie poniżej 40°C...")}
    M117 Studzenie dyszy...
    UPDATE_DELAYED_GCODE ID=wait_temp DURATION=1
    M106 P0 S255

[gcode_macro WAIT_TEMP_END]
description: Zakończenie procedury chłodzenia
gcode:
    {action_respond_info("=== CHŁODZENIE ZAKOŃCZONE ===")}
    {action_respond_info("Temperatura bezpieczna osiągnięta. Wiatraki gasną.")}
    M117 Stygnięcie zakończone!
    UPDATE_DELAYED_GCODE ID=wait_temp DURATION=0
    M106 P0 S0

[gcode_macro PRINT_PREPARED]
description: Oznaczenie drukarki jako przygotowanej do startu
gcode:
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=1
    {action_respond_info("Drukarka w pełni przygotowana i naładowana gotowością!")}
    M117 Druk przygotowany!

[gcode_macro PRINT_PREPARE_CLEAR]
description: Reset flagi przygotowania do druku
gcode:
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0
    {action_respond_info("Reset flagi przygotowania.")}
    M117 Reset przygotowania.

[gcode_macro INPUTSHAPER]
description: Automatyczna kalibracja rezonansów (Input Shaper) z użyciem akcelerometru
gcode:
    {action_respond_info("=== ROZPOCZYNAM KALIBRACJĘ INPUT SHAPER ===")}
    M117 Kalibracja rezonansów...

    {action_respond_info("[1/5] Odcinam czujniki filamentu...")}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0

    {action_respond_info("[2/5] Bazowanie osi (G28) i środek stołu...")}
    M117 Bazowanie do shaperów...
    G90
    G28
    {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
    {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
    G1 X{POSITION_X} Y{POSITION_Y} F6000
    G1 Z10 F600

    {action_respond_info("[3/5] Odpalamy SHAPER_CALIBRATE! Nie dotykaj sprzętu...")}
    M117 Trzęsienie ziemi (Shaper)...
    SHAPER_CALIBRATE

    {action_respond_info("[4/5] Zapisuję uzyskane częstotliwości (SAVE_CONFIG)...")}
    M117 Zapisuję konfig...
    SAVE_CONFIG

    {action_respond_info("[5/5] Przywracam czujniki filamentu.")}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
    
    M117 Shaper skalibrowany!
    {action_respond_info("Input Shaper zoptymalizowany!")}

[gcode_macro BEDPID]
description: Kalibracja PID stołu grzewczego na 100°C
gcode:
    {action_respond_info("=== ROZPOCZYNAM KALIBRACJĘ PID STOŁU (100°C) ===")}
    M117 Kalibracja PID stołu...
    PID_CALIBRATE HEATER=heater_bed TARGET=100
    SAVE_CONFIG
    M117 PID stołu gotowy!
    {action_respond_info("Stół skalibrowany termicznie!")}

[gcode_macro TURNOFFINPUTSHAPER]
description: Całkowite wyłączenie Input Shapera
gcode:
    {action_respond_info("=== WYŁĄCZAM INPUT SHAPER ===")}
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    M117 Shaper wyłączony!
    {action_respond_info("Input Shaper wyłączony.")}

[gcode_macro G29]
description: Procedura pomiaru i kalibracji siatki stołu (Bed Leveling)
gcode:
    {% if 'PROBE_COUNT' in params|upper %}
        {% set get_count = ('PROBE_COUNT' + params.PROBE_COUNT) %}
    {% else %}
        {% set get_count = "" %}
    {% endif %}

    {% set bed_temp = params.BED_TEMP|default(105)|float %}

    {action_respond_info("=== START PROCEDURY G29 (Stół: " ~ bed_temp ~ "°C) ===")}
    M117 G29 Start procedury...

    {action_respond_info("[1/6] Wyłączam czujniki filamentu...")}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0

    {action_respond_info("[2/6] Bazowanie osi (G28) i czyszczenie siatki...")}
    M117 Bazowanie G28...
    G28
    BED_MESH_CLEAR

    {action_respond_info("[3/6] Dokładne pozycjonowanie i limity prędkości...")}
    M117 Dokładne bazowanie...
    ACCURATE_G28
    M204 S5000
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000

    {action_respond_info("[4/6] Skanowanie siatki stołu (BED_MESH_CALIBRATE)...")}
    M117 Skanowanie siatki...
    BED_MESH_CALIBRATE {get_count}
    BED_MESH_OUTPUT

    {action_respond_info("[5/6] Zapisuję nową siatkę (SAVE_CONFIG)...")}
    M117 Zapisujemy siatkę...
    SAVE_CONFIG

    {action_respond_info("[6/6] Koniec procedury G29!")}
    TURN_OFF_HEATERS
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
    
    M117 G29 Zakończone pomyślnie!
    {action_respond_info("Stół zmapowany perfekcyjnie!")}

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

[gcode_macro _START_END_PARAMS]
variable_bed_warp_wait_multiplier: 8.0
variable_bed_warp_fraction_wait: 0.75
variable_bed_warp_wait_interval: 10
variable_enable_disable_filament_sensor: True
variable_start_max_velocity: 400
variable_start_max_accel: 90000
variable_carto_touch_retries: 20
variable_carto_touch_samples: 3
variable_start_preheat_nozzle_temp: 150
variable_end_print_cool_down: False
variable_end_print_cool_down_nozzle_temp: 80.0
gcode:

[gcode_macro _CLIENT_VARIABLE]
variable_park_at_cancel   : True
variable_custom_park_dz   : 5.0
variable_use_custom_pos   : True
variable_custom_park_x    : 210.0
variable_custom_park_y    : 210.0
variable_retract          : 1.0
variable_cancel_retract   : 2.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 150.0
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
gcode:

[gcode_macro START_PRINT]
variable_bed_temp: 105
variable_extruder_temp: 245
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(105)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(245)|float %}

    {action_respond_info("=== START PROCEDURY DRUKU (Stół: " ~ BED_TEMP ~ "°C | Dysza: " ~ EXTRUDER_TEMP ~ "°C) ===")}
    M117 Start procedury...

    # 1. Wstępne grzanie i bazowanie
    {action_respond_info("[1/6] Wstępne nagrzewanie dyszy do 150°C oraz stołu do " ~ BED_TEMP ~ "°C...")}
    M117 Nagrzewanie wstępne...
    M104 S150
    M140 S{BED_TEMP}

    {action_respond_info("[2/6] Bazowanie osi (G28) i czyszczenie starej siatki...")}
    M117 Bazowanie osi G28...
    G28
    BED_MESH_CLEAR
    SET_VELOCITY_LIMIT ACCEL=5000 MINIMUM_CRUISE_RATIO=0.5 SQUARE_CORNER_VELOCITY=5 

    # 2. Stabilizacja temperatur
    {action_respond_info("[3/6] Oczekiwanie na pełne nagrzanie stołu i dyszy...")}
    M117 Czekam na stół {BED_TEMP}°C...
    M190 S{BED_TEMP}
    M109 S150

    # 3. Kalibracja Z i Siatka KAMP
    {action_respond_info("[4/6] Precyzyjny dotyk stołu Cartographerem (Touch Home)...")}
    M117 Cartographer Touch...
    G28 Z
    CARTOGRAPHER_TOUCH_HOME

    {action_respond_info("[5/6] Skanowanie adaptacyjnej siatki stołu (KAMP)...")}
    M117 Skanowanie siatki KAMP...
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 4. Dogrzanie robocze i linia rozbiegowa
    {action_respond_info("[6/6] Parkowanie i dobijanie temperatury hotendu CHCB-OT do " ~ EXTRUDER_TEMP ~ "°C...")}
    M117 Dogrzewanie dyszy...
    SMART_PARK
    SET_VELOCITY_LIMIT ACCEL=8400 MINIMUM_CRUISE_RATIO=0.5 SQUARE_CORNER_VELOCITY=5 
    M109 S{EXTRUDER_TEMP}

    {action_respond_info("Układam linię rozbiegową (LINE_PURGE)...")}
    M117 Line Purge...
    LINE_PURGE

    M117 Drukowanie w toku!
    {action_respond_info("Mordo! Model wczytany, jedziemy z tym!")}

[gcode_macro LOAD_FILAMENT]
description: Ładowanie filamentu do hotendu
gcode:
    {% set EXTRUDE_LENGTH = params.EXTRUDE_LENGTH|default(50)|float %}
    {% set EXTRUDE_SPEED = params.EXTRUDE_SPEED|default(5)|float %}
    {% set RETRACT_LENGTH = params.RETRACT_LENGTH|default(2)|float %}
    {% set TEMPERATURE = params.TEMPERATURE|default(220)|float %}

    {action_respond_info("=== PROCEDURA ŁADOWANIA FILAMENTU (Cel: " ~ TEMPERATURE ~ "°C) ===")}
    {action_respond_info("[1/4] Rozpalam piec w CHCB-OT do " ~ TEMPERATURE ~ "°C...")}
    M117 Grzanie do {TEMPERATURE}C...
    M104 S{TEMPERATURE}
    M109 S{TEMPERATURE}

    {action_respond_info("[2/4] Wciągam " ~ EXTRUDE_LENGTH ~ " mm plastiku...")}
    M117 Wciągam filament...
    G92 E0
    G1 E{EXTRUDE_LENGTH} F{EXTRUDE_SPEED * 60}

    {action_respond_info("[3/4] Retrakcja (" ~ RETRACT_LENGTH ~ " mm) i stabilizacja (5s)...")}
    M117 Retrakcja i stabilizacja...
    G1 E-{RETRACT_LENGTH} F{EXTRUDE_SPEED * 60}
    G4 P5000

    {action_respond_info("[4/4] Wyłączam grzałkę ekstrudera.")}
    M104 S0
    M117 Załadowano! Mniam!
    {action_respond_info("Mmm, pyszny plastik! Extruder najedzony, można drukować!")}

[gcode_macro UNLOAD_FILAMENT]
description: Rozładowanie filamentu z hotendu
gcode:
    {% set RETRACT_LENGTH = params.RETRACT_LENGTH|default(100)|float %}
    {% set RETRACT_SPEED = params.RETRACT_SPEED|default(5)|float %}
    {% set FAST_RETRACT_LENGTH = params.FAST_RETRACT_LENGTH|default(20)|float %}
    {% set FAST_RETRACT_SPEED = params.FAST_RETRACT_SPEED|default(40)|float %}
    {% set TEMPERATURE = params.TEMPERATURE|default(220)|float %}

    {action_respond_info("=== PROCEDURA EWAKUACJI FILAMENTU (Cel: " ~ TEMPERATURE ~ "°C) ===")}
    {action_respond_info("[1/3] Rozgrzewam hotend CHCB-OT do " ~ TEMPERATURE ~ "°C...")}
    M117 Grzanie do wyplucia...
    M104 S{TEMPERATURE}
    M109 S{TEMPERATURE}

    {action_respond_info("[2/3] Ewakuacja w toku...")}
    M117 Wypluwam filament...
    G92 E0
    G1 E-{RETRACT_LENGTH} F{RETRACT_SPEED * 60}
    G1 E-{FAST_RETRACT_LENGTH} F{FAST_RETRACT_SPEED * 60}

    {action_respond_info("[3/3] Przełączam grzałkę na bezpieczne 150°C.")}
    M104 S150
    M117 Wyplute! Czysto i przyjemnie.
    {action_respond_info("Stary plastik ewidentnie miał dość życia, można pakować nowy!")}

[gcode_macro QUICK_CLEAN_NOZZLE]
description: Szybkie czyszczenie dyszy
gcode:
    {action_respond_info("=== SZYBKIE CZYSZCZENIE DYSZY ===")}
    M117 Czyszczenie dyszy...
    M104 S150
    G1 X10 Y10 Z10 F1000
    M400
    G1 Z2 F300
    M106 P0 S255
    G1 X75 Y10 F300
    M107

[gcode_macro END_PRINT]
description: Procedura zakończenia wydruku, gaszenia sprzętu i parkowania
gcode:
    {action_respond_info("=== WYDRUK ZAKOŃCZONY SUKCESEM! SPRZĄTAMY PO ROBOCIE ===")}
    M117 Wydruk zakończony!

    # 1. Bezpieczna retrakcja i opcjonalne uniesienie osi Z, żeby nie przypalić modelu
    G91
    G1 E-2 F2700                 ; Szybka, krótka retrakcja
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < (max_z - 10) %}
        G1 Z10 F3000             ; Unieś głowicę o 10 mm w górę
    {% else %}
        G1 Z{max_z - cur_z} F3000 ; Lub do samego maxa, jeśli brakuje miejsca
    {% endif %}
    G90

    # 2. Parkowanie głowicy z tyłu/boku (wykorzystujemy współrzędne z _CLIENT_VARIABLE)
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set park_x = client.custom_park_x|default(210.0) %}
    {% set park_y = client.custom_park_y|default(210.0) %}
    
    {action_respond_info("Parkuję głowicę w pozycji X=" ~ park_x ~ " Y=" ~ park_y ~ "...")}
    G1 X{park_x} Y{park_y} F6000

    # 3. Gaszenie grzałek
    {action_respond_info("Wyłączam stół i hotend CHCB-OT.")}
    TURN_OFF_HEATERS

    # 4. Gaszenie kompletu wentylatorów (Part_Fan, Side_Fan, Chamber_Fan)
    M106 S0       # Wyłącza Part_Fan (P0)
    M107 P2       # Wyłącza Side_Fan
    M107 P3       # Wyłącza Chamber_Fan

    # 5. Wyłączenie silników osi (opcjonalnie, żeby nie trzymały prądu)
    M84 X Y E     # Wyłącz silniki X, Y oraz ekstruder (Z zostaje zablokowane)

    M117 Gotowe do odbioru!
    {action_respond_info("Kolejny projekt wpadł do portfolio. Czas zdejmować model ze stołu!")}